plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
}

loom {
	mods {
		"opbosses" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// The One Piece Mod. The bosses are its boss mobs underneath (health bar, phases, rematches, bounty),
	// and their crews are its pirate NPCs.
	// It isn't on a maven, so build it and copy the jar into libs/ (see README).
	implementation files("libs/${project.onepiece_jar}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

// In-world tests (src/gametest). They never ship in the mod jar.
// Run them with `gradlew runClientGameTest`: a game window opens, plays through the bosses and lairs and closes.
// Only `runClientGameTest` runs them; `runClient` and the mod jar never do.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "opbosses-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

// Pick what the in-world test plays (see src/gametest/.../TestFilter.java), e.g.
// `gradlew runClientGameTest -Dopbosses.tests=lairs -Dopbosses.only=gran_tesoro`. By default it runs bosses, lairs and world mobs.
tasks.matching { it.name == "runClientGameTest" }.configureEach {
	// Read through providers so the configuration cache keys on them (a plain System.properties loop isn't tracked,
	// and a cached run would silently ignore a new -Dopbosses.tests).
	["opbosses.tests", "opbosses.only"].each { k ->
		def v = providers.systemProperty(k)
		if (v.isPresent()) {
			systemProperty k, v.get()
		}
	}
}
